name: Continuous Integration (CI)

"on":
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. BACKEND TEST SUITE & COVERAGE
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Linux System Dependencies (OCR & PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils libpq-dev

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Pytest Test Suite with Coverage
        working-directory: ./backend
        run: |
          python -m pytest --cov=app --cov-report=term-missing -v

  # ---------------------------------------------------------------------------
  # 2. FRONTEND TYPECHECK & PRODUCTION BUILD
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Typecheck & Vite Bundle
        working-directory: ./frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. DOCKER & COMPOSE CONFIGURATION VALIDATION
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
